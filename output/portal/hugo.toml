baseURL = "https://kenjatimejp.com/"
languageCode = "ja"
title = "kenjatimejp - ランキングまとめ"
theme = "PaperMod"
defaultContentLanguage = "ja"
timeZone = "Asia/Tokyo"
enableRobotsTXT = true

[services]
  [services.googleAnalytics]
    # GA4測定ID（G-から始まるID）。GA4管理画面のデータストリーム詳細から取得して置き換える
    # 参照: docs/google-api-setup.md
    ID = "G-0VW0D9FZ68"

[params]
  description = "AIツール・ドラマ・エンタメなど、さまざまなジャンルのおすすめランキングをまとめてご紹介します。"
  author = "kenjatimejp編集部"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "kenjatimejp - ランキングまとめ"
    Content = "AIツール・2026年夏ドラマなど、さまざまなジャンルのおすすめランキングを徹底比較。あなたにぴったりの一本・一つを見つけよう。"

[[params.socialIcons]]
  name = "rss"
  url = "/index.xml"

[menu]
  [[menu.main]]
    name = "AIツール"
    url = "/ai-tools/"
    weight = 10
  [[menu.main]]
    name = "ドラマ"
    url = "/drama-2026-summer/"
    weight = 20
  [[menu.main]]
    name = "海外旅行"
    url = "/overseas-travel/"
    weight = 30
  [[menu.main]]
    name = "世界遺産"
    url = "/world-heritage/"
    weight = 40
  [[menu.main]]
    name = "プライバシーポリシー"
    url = "/privacy/"
    weight = 50
  [[menu.main]]
    name = "お問い合わせ"
    url = "/contact/"
    weight = 60
  [[menu.main]]
    name = "運営者情報"
    url = "/about/"
    weight = 70

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
