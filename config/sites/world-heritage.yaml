site_id: world-heritage
name: 死ぬまでに行きたい世界遺産ランキング
theme: 世界遺産
target_audience: 一生に一度は世界的な絶景・遺跡を訪れたいと考えている旅行好き
main_keyword: 世界遺産 ランキング 死ぬまでに行きたい
base_url: https://kenjatimejp.com
publisher: hugo

article_plan:
  top_page: 0
  ranking_articles: 1
  individual_articles: 10
  faq_articles: 0
  related_articles: 0

max_monthly_cost_usd: 10.0

ranking_targets:
  - name: グレートバリアリーフ（オーストラリア）
    url: https://www.gbrmpa.gov.au/
    category: オセアニア
    price_free: false
    price_paid: "ツアー参加費が必要（船会社・内容により変動）"
    description: 全長2,000km超、世界最大のサンゴ礁群。宇宙からも確認できるスケールで、ダイビング・シュノーケリングの聖地として知られる。
    pros:
      - 圧倒的なスケールの海中世界
      - ダイビング初心者向けのツアーも豊富
      - ケアンズなど拠点都市からアクセスしやすい
    cons:
      - サンゴの白化など環境変化の影響を受けやすい
      - 天候・海況によりツアーが中止になる場合がある

  - name: マチュピチュ（ペルー）
    url: https://www.peru.travel/en
    category: 南北アメリカ
    price_free: false
    price_paid: "入場チケット制（事前予約推奨）"
    description: アンデス山中の尾根に築かれたインカ帝国の空中都市遺跡。標高2,400m級の霧に包まれた石造建築群は「未踏の地」として世界的に有名。
    pros:
      - 他に類を見ない山岳都市の景観
      - インカ・トレイルなどトレッキングでも到達可能
      - 周辺のクスコも世界遺産で周遊しやすい
    cons:
      - 入場者数に制限があり事前予約がほぼ必須
      - 高地のため体調管理が必要

  - name: 万里の長城（中国）
    url: https://www.mct.gov.cn/
    category: アジア
    price_free: false
    price_paid: "区間ごとに入場料あり"
    description: 総延長数千kmにおよぶ人類史上最大級の建造物。北京近郊の八達嶺などが観光の定番区間として整備されている。
    pros:
      - 区間によって混雑度・難易度を選べる
      - 北京から日帰りでアクセス可能な区間が多い
      - 四季それぞれで違った景観が楽しめる
    cons:
      - 人気区間は観光シーズンに混雑しやすい
      - 一部区間は起伏が激しく歩きやすい靴が必須

  - name: タージ・マハル（インド）
    url: https://www.incredibleindia.gov.in/en
    category: アジア
    price_free: false
    price_paid: "入場チケット制（外国人料金あり）"
    description: ムガル帝国皇帝が愛妃のために建てた総大理石の霊廟。左右対称の完璧な美しさと朝焼けに染まる姿で世界的に知られる。
    pros:
      - 息をのむほど精緻な大理石建築
      - 早朝訪問で朝日に染まる姿を鑑賞できる
      - デリーから日帰り・1泊で訪問しやすい
    cons:
      - 観光シーズンは非常に混雑する
      - 夏季（4〜6月）は酷暑になりやすい

  - name: アンコールワット（カンボジア）
    url: https://www.tourismcambodia.org/
    category: アジア
    price_free: false
    price_paid: "入場チケット制（1日券・3日券・7日券あり）"
    description: クメール王朝が築いた世界最大級の石造寺院群。日の出とともにシルエットが浮かび上がる光景は「一生に一度は見たい絶景」として名高い。
    pros:
      - 広大な遺跡群を数日かけてじっくり周遊できる
      - 日の出・日の入りの絶景スポットが複数ある
      - シェムリアップの街から近く旅程を組みやすい
    cons:
      - 遺跡群が広いため周遊には体力が必要
      - 乾季（11〜2月）以外は高温多湿になりやすい

  - name: ギザの三大ピラミッド（エジプト）
    url: https://egypt.travel/en/
    category: 中東・アフリカ
    price_free: false
    price_paid: "入場チケット制（内部見学は別途追加料金）"
    description: 紀元前に築かれた人類最古の巨大建造物群。ピラミッド内部への入場や、隣接するスフィンクスとのセットでの見学が定番。
    pros:
      - 数千年前の建造物を間近で体感できる
      - カイロ市街から日帰りで訪問可能
      - ラクダツアーなど周辺体験も充実
    cons:
      - 客引きなどへの対応が旅行者を選ぶ場面がある
      - 真夏は強い日差しへの対策が必須

  - name: ガラパゴス諸島（エクアドル）
    url: https://www.galapagos.gob.ec/en/
    category: 南北アメリカ
    price_free: false
    price_paid: "国立公園入園料が必要（訪問前納付制）"
    description: ダーウィンの進化論の着想源となった孤立した火山諸島。ゾウガメやウミイグアナなど固有種が人を恐れず生息する類まれな環境。
    pros:
      - 野生動物との距離が非常に近い
      - 島ごとに異なる生態系を楽しめる
      - クルーズツアーで効率よく周遊できる
    cons:
      - 本土から離れており渡航費用がかさみやすい
      - 環境保護のため訪問できるエリアが制限されている

  - name: グランドキャニオン国立公園（アメリカ）
    url: https://www.nps.gov/grca/
    category: 南北アメリカ
    price_free: false
    price_paid: "車両1台あたりの入園料あり（数日間有効）"
    description: コロラド川が数百万年かけて削り出した全長約450kmの大峡谷。サウスリムの展望台から見る地層のグラデーションは圧巻の一言。
    pros:
      - 展望台まで車でアクセスしやすい
      - ハイキング・ラフティングなど体験の幅が広い
      - 朝夕で表情が大きく変わる景観
    cons:
      - 夏季は日中の気温が非常に高くなる
      - 人気展望台の駐車場は混雑しやすい

  - name: イエローストーン国立公園（アメリカ）
    url: https://www.nps.gov/yell/
    category: 南北アメリカ
    price_free: false
    price_paid: "車両1台あたりの入園料あり（数日間有効）"
    description: 世界初の国立公園として指定された広大な自然保護区。間欠泉オールド・フェイスフルやカラフルな熱泉、野生のバイソンが見どころ。
    pros:
      - 間欠泉など地球のダイナミズムを体感できる
      - 野生動物の遭遇率が高い
      - トレイルの難易度が幅広く選びやすい
    cons:
      - 敷地が広大で周遊には数日必要
      - 冬季は積雪により立ち入れるエリアが限られる

  - name: ヴェネツィアとその潟（イタリア）
    url: https://www.veneziaunica.it/en
    category: ヨーロッパ
    price_free: false
    price_paid: "教会・美術館等は個別入場料、街への訪問税が別途必要な場合あり"
    description: 潟の上に築かれた「水の都」。運河沿いの街並みとゴンドラ、サン・マルコ広場を中心とした景観が世界中の旅行者を魅了し続けている。
    pros:
      - 街全体が芸術品のような景観
      - ゴンドラや水上バスでの移動自体が観光体験になる
      - 近隣都市（ミラノ・フィレンツェ）と周遊しやすい
    cons:
      - 観光シーズンは非常に混雑する
      - 高潮（アクア・アルタ）の時期は浸水することがある

